services:
  - type: web
    name: vit-vellore-intelligent-faq-chatbot
    runtime: python
    region: oregon
    plan: free
    buildCommand: "pip install torch --index-url https://download.pytorch.org/whl/cpu && pip install -r requirements.txt && python scripts/build_embeddings.py"
    startCommand: "uvicorn backend.app:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: USE_MYSQL
        value: false
